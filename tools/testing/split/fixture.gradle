gradle.projectsEvaluated {
    def p=rootProject
    p.sourceSets.create('splitProbe') {
        java.srcDir('tools/testing/split/src')
        resources.srcDir('tools/testing/split/resources')
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
    }
    p.tasks.register('splitProbeJar', Jar) {
        archiveBaseName='compass-split-probe'; archiveVersion='1.0'
        from p.sourceSets.splitProbe.output
        dependsOn 'splitProbeClasses'
    }
    p.reobf.create('splitProbeJar')
    p.tasks.named('reobfSplitProbeJar').configure { libraries.from(p.sourceSets.main.output) }
}
