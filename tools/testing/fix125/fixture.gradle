gradle.projectsEvaluated {
    def p=rootProject
    p.sourceSets.create('fix125') {
        java.srcDir('tools/testing/fix125/src')
        java.include('**/Fix125Checks.java')
        resources.srcDir('tools/testing/fix125/resources')
        compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
    }
    p.tasks.register('fix125Jar', Jar) {
        archiveBaseName='unified125-checks'; archiveVersion='1.0'
        from p.sourceSets.fix125.output
        dependsOn 'fix125Classes'
    }
    p.reobf.create('fix125Jar')
    p.tasks.named('reobfFix125Jar').configure { libraries.from(p.sourceSets.main.output) }
}
