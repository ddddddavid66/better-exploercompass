plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.54' }
group = 'com.chaosthedude.explorerscompass'
version = '1.1.0'
base { archivesName = 'ExplorersCompassUnified-1.20.1-forge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets {
    benchmark {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    benchmarkHarness {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    pinyinTools { java.srcDirs = ['tools/pinyin'] }
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--mixin', 'explorerscompass-unified.mixins.json'
            mods { explorerscompass { source sourceSets.main } }
            if (project.hasProperty('smoke')) mods { filterschecks { source sourceSets.smoke } }
        }
        client {}
        server { args '--nogui' }
    }
}
repositories {
    mavenCentral { content { excludeGroup 'com.github.promeg' } }
    maven { url = 'https://maven.aliyun.com/repository/public'; content { includeGroup 'com.github.promeg' } }
    maven { url = 'https://maven.minecraftforge.net' }
}
configurations.annotationProcessor.extendsFrom(configurations.compileClasspath)
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    // 原拼音库只在生成工具与测试中使用，不进入发布包。
    pinyinToolsImplementation 'com.github.promeg:tinypinyin:2.0.3'
    testImplementation 'com.github.promeg:tinypinyin:2.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
    benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}
def generatedPinyin = layout.buildDirectory.dir('generated/pinyin')
sourceSets.main.resources.srcDir(generatedPinyin)
tasks.register('generatePinyinTable', JavaExec) {
    dependsOn 'pinyinToolsClasses'
    classpath = sourceSets.pinyinTools.runtimeClasspath
    mainClass = 'GeneratePinyinTable'
    args generatedPinyin.get().file('assets/explorerscompass/pinyin.bin').asFile.absolutePath
    inputs.files(sourceSets.pinyinTools.allSource)
    outputs.dir(generatedPinyin)
}
def mixinOutput = layout.buildDirectory.dir('generated/mixin')
sourceSets.main.resources.srcDir(mixinOutput)
tasks.named('compileJava', JavaCompile).configure {
    dependsOn 'createMcpToSrg'
    doFirst {
        mixinOutput.get().asFile.mkdirs()
        def mappings = layout.buildDirectory.file('generated/mixin-mappings.srg').get().asFile
        net.minecraftforge.srgutils.IMappingFile.load(tasks.createMcpToSrg.outputs.files.singleFile)
            .write(mappings.toPath(), net.minecraftforge.srgutils.IMappingFile.Format.SRG, false)
        options.compilerArgs += ['-AreobfSrgFile=' + mappings,
            '-AoutRefMapFile=' + mixinOutput.get().file('explorerscompass-unified.refmap.json').asFile,
            '-AdefaultObfuscationEnv=searge']
    }
}
tasks.named('processResources').configure { dependsOn 'compileJava', 'generatePinyinTable' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 发布保留源码名，省去行号和局部变量调试表；完整源码随交付提供。
    options.debugOptions.debugLevel = 'source'
}
tasks.named('test').configure { useJUnitPlatform(); testLogging { events 'passed', 'failed', 'skipped' } }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
jar {
    from('NOTICE.txt') { into 'META-INF' }
    manifest { attributes 'MixinConfigs': 'explorerscompass-unified.mixins.json' }
    finalizedBy 'reobfJar'
}
tasks.register('smokeJar', Jar) {
    archiveBaseName = 'unifiedchecks'; archiveVersion = '1.0'
    from sourceSets.smoke.output
    dependsOn 'smokeClasses'
}
reobf { smokeJar {} }
// 重映射测试工具需要主工程类，才能识别指南针界面继承的方法。
tasks.named('reobfSmokeJar').configure { libraries.from(sourceSets.main.output) }
// Reobfuscation retains ZIP directory records and uses the default compression.
// Compact the final unsigned archive without changing any file contents.
tasks.register('compactRelease') {
    dependsOn 'reobfJar'
    doLast {
        def archive = tasks.jar.archiveFile.get().asFile.toPath()
        def temporary = archive.resolveSibling(archive.fileName.toString() + '.compact')
        try {
            new java.util.zip.ZipFile(archive.toFile()).withCloseable { input ->
                new java.util.zip.ZipOutputStream(java.nio.file.Files.newOutputStream(temporary)).withCloseable { output ->
                    output.setLevel(9)
                    input.entries().toList().findAll { !it.directory }.sort { it.name }.each { entry ->
                        def compact = new java.util.zip.ZipEntry(entry.name)
                        compact.setTimeLocal(java.time.LocalDateTime.of(1980, 1, 1, 0, 0))
                        output.putNextEntry(compact)
                        input.getInputStream(entry).withCloseable { it.transferTo(output) }
                        output.closeEntry()
                    }
                }
            }
            java.nio.file.Files.move(temporary, archive, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally {
            java.nio.file.Files.deleteIfExists(temporary)
        }
    }
}
tasks.register('checkReleaseSize') {
    dependsOn 'compactRelease'
    doLast {
        def bytes = tasks.jar.archiveFile.get().asFile.length()
        if (bytes > 450 * 1024) throw new GradleException('Release exceeds 450 KiB: ' + bytes)
        println 'Unified release size: ' + bytes + ' bytes'
    }
}
tasks.named('build').configure { dependsOn 'checkReleaseSize' }

tasks.register('benchmarkHarnessJar', Jar) {
    archiveBaseName = 'compassbench'; archiveVersion = '1.0'
    from sourceSets.benchmarkHarness.output
    dependsOn 'benchmarkHarnessClasses'
}
reobf { benchmarkHarnessJar {} }
tasks.register('microBenchmark', JavaExec) {
    dependsOn 'benchmarkClasses'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    if (project.hasProperty('benchmarkArgs')) args project.property('benchmarkArgs').split(' ')
    if (project.hasProperty('baselineJar')) systemProperty 'compassbench.baselineJar', file(project.property('baselineJar')).absolutePath
    if (project.hasProperty('enhanceJar')) systemProperty 'compassbench.enhanceJar', file(project.property('enhanceJar')).absolutePath
}
