plugins { id 'java-library' }
group = 'com.david.compass'
version = '1.0.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
repositories { mavenCentral() }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// 使用根工程同版本的 Forge 映射；公共核心可单独编译。
sourceSets.main.compileClasspath += rootProject.sourceSets.main.compileClasspath
sourceSets.test.compileClasspath += rootProject.sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += rootProject.sourceSets.main.compileClasspath
