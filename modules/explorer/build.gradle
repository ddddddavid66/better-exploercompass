plugins { id 'java' }
version = '1.3.3'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
dependencies { implementation project(':runtime') }
sourceSets.main.compileClasspath += rootProject.sourceSets.main.compileClasspath
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// 发行包必须经过根工程的 Forge 重映射和共享核心装配。
tasks.named('jar').configure { enabled = false }
sourceSets.main.java.srcDir(rootProject.file('src/main/java'))
