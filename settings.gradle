pluginManagement {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
    }
}
rootProject.name = 'explorerscompass-unified'
include 'runtime', 'explorer', 'creature'
project(':runtime').projectDir = file('modules/runtime')
project(':explorer').projectDir = file('modules/explorer')
project(':creature').projectDir = file('modules/creature')
